<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能数据分析平台 - Smart DA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- SheetJS (xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
    <div id="app">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <h1 class="text-2xl font-bold text-gray-900">智能数据分析平台</h1>
                <p class="text-sm text-gray-500 mt-1">机构成交数据分析与智能图表生成</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Tab Navigation -->
            <div class="mb-6">
                <div class="border-b border-gray-200">
                    <nav class="-mb-px flex space-x-8">
                        <button
                            @click="activeTab = 'dashboard'"
                            :class="[
                                'py-4 px-1 border-b-2 font-medium text-sm transition-colors',
                                activeTab === 'dashboard'
                                    ? 'border-blue-500 text-blue-600'
                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                            ]"
                        >
                            数据加载与看板
                        </button>
                        <button
                            @click="activeTab = 'ai'"
                            :class="[
                                'py-4 px-1 border-b-2 font-medium text-sm transition-colors',
                                activeTab === 'ai'
                                    ? 'border-blue-500 text-blue-600'
                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                            ]"
                        >
                            AI 图表智能生成
                        </button>
                    </nav>
                </div>
            </div>

            <!-- Dashboard Tab -->
            <div v-show="activeTab === 'dashboard'" class="space-y-6">
                <!-- File Upload Section -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">数据加载</h2>
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg cursor-pointer hover:bg-blue-700 transition-colors">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            选择 Excel 文件
                            <input type="file" @change="handleFileUpload" accept=".xlsx,.xls" class="hidden">
                        </label>
                        <span v-if="rawData.length > 0" class="text-sm text-green-600 font-medium">
                            ✓ 已加载 {{ rawData.length }} 条数据
                        </span>
                        <span v-else class="text-sm text-gray-500">
                            请上传 Excel 文件
                        </span>
                    </div>
                </div>

                <!-- Filters Section -->
                <div v-if="rawData.length > 0" class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">筛选条件</h2>
                    
                    <!-- Row 1: Date Range -->
                    <div class="mb-4 pb-4 border-b border-gray-100">
                        <div class="flex items-center space-x-4">
                            <span class="text-sm font-medium text-gray-700">日期范围：</span>
                            <div class="flex items-center space-x-2">
                                <input
                                    type="date"
                                    v-model="filters.startDate"
                                    class="px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                                >
                                <span class="text-gray-500">-</span>
                                <input
                                    type="date"
                                    v-model="filters.endDate"
                                    class="px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Other Filters -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- Institution Type -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">机构类型</label>
                            <select
                                v-model="filters.institutionType"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                            >
                                <option value="">全部</option>
                                <option v-for="type in uniqueInstitutionTypes" :key="type" :value="type">{{ type }}</option>
                            </select>
                        </div>

                        <!-- Term -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">期限</label>
                            <select
                                v-model="filters.term"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                            >
                                <option value="">全部</option>
                                <option v-for="t in uniqueTerms" :key="t" :value="t">{{ t }}</option>
                            </select>
                        </div>

                        <!-- Direction -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">交易方向</label>
                            <select
                                v-model="filters.direction"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                            >
                                <option value="">全部</option>
                                <option v-for="dir in uniqueDirections" :key="dir" :value="dir">{{ dir }}</option>
                            </select>
                        </div>

                        <!-- Transaction Type -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">交易类型</label>
                            <select
                                v-model="filters.transactionType"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                            >
                                <option value="">请选择</option>
                                <option value="全部">全部</option>
                                <option v-for="type in transactionTypes" :key="type" :value="type">{{ type }}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div v-if="rawData.length > 0" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Line Chart -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">趋势分析</h3>
                        <div id="lineChart" style="width: 100%; height: 400px;"></div>
                    </div>

                    <!-- Pie Chart -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold text-gray-900">比例分析</h3>
                            <select
                                v-model="pieChartDimension"
                                class="text-sm border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 px-2 py-1"
                            >
                                <option value="机构类型">按机构类型</option>
                                <option value="期限">按期限</option>
                                <option value="交易方向">按交易方向</option>
                                <option value="交易类型">按交易类型</option>
                            </select>
                        </div>
                        <div id="pieChart" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>
            </div>

            <!-- AI Tab -->
            <div v-show="activeTab === 'ai'" class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">DeepSeek 智能分析</h2>
                    
                    <!-- API Key Status -->
                    <div v-if="!apiKey" class="mb-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                        <p class="text-sm text-yellow-800">
                            ⚠️ 未检测到 API Key，请在 <code class="bg-yellow-100 px-1 rounded">js/config.js</code> 文件中配置 <code class="bg-yellow-100 px-1 rounded">ARK_API_KEY</code>
                        </p>
                    </div>
                    <div v-else class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                        <p class="text-sm text-green-800">
                            ✓ API Key 已加载
                        </p>
                    </div>

                    <!-- Data Status -->
                    <div v-if="rawData.length === 0" class="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <p class="text-sm text-blue-800">
                            💡 提示：请先在"数据加载与看板"标签页中上传 Excel 数据文件
                        </p>
                    </div>

                    <!-- Chat Interface -->
                    <div class="space-y-4">
                        <div class="flex space-x-2">
                            <input
                                v-model="aiQuery"
                                @keyup.enter="handleAIQuery"
                                :disabled="!apiKey || rawData.length === 0"
                                type="text"
                                placeholder="请输入您的数据分析需求，例如：请画出不同机构类型的交易量占比饼图"
                                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100"
                            >
                            <button
                                @click="handleAIQuery"
                                :disabled="!apiKey || rawData.length === 0 || isLoadingAI"
                                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
                            >
                                {{ isLoadingAI ? '生成中...' : '生成图表' }}
                            </button>
                        </div>

                        <!-- AI Chart Container -->
                        <div v-if="aiChartData" class="mt-6">
                            <div class="bg-gray-50 rounded-lg p-4 mb-4">
                                <h3 class="text-md font-semibold text-gray-900 mb-2">生成的图表</h3>
                                <div id="aiChart" style="width: 100%; height: 500px;"></div>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div v-if="aiError" class="p-4 bg-red-50 border border-red-200 rounded-lg">
                            <p class="text-sm text-red-800">{{ aiError }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
